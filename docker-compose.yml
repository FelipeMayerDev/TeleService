services:
  discordbot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: discordbot/Dockerfile
      target: discordbot
    env_file: .env
    network_mode: host
    volumes:
      - ./database.sqlite:/app/database.sqlite

  telegrambot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: telegrambot/Dockerfile
      target: telegrambot
    env_file: .env
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./database.sqlite:/app/telegrambot/database.sqlite
      - ./telegrambot/handlers/sticker.py:/app/telegrambot/handlers/sticker.py:ro
      - ./telegrambot/main.py:/app/telegrambot/main.py:ro
      - rembg-model:/root/.u2net

  walter-monitor:
    restart: unless-stopped
    image: python:3.11-slim
    env_file: .env
    volumes:
      - ./database.sqlite:/data/database.sqlite:ro
      - ./walter_monitor.py:/app/walter_monitor.py:ro
    entrypoint: ["python", "-u", "/app/walter_monitor.py"]

  steam:
    restart: unless-stopped
    build:
      context: .
      dockerfile: steam/Dockerfile
      target: steam
    env_file: .env
    volumes:
      - ./database.sqlite:/app/database.sqlite

volumes:
  telegrambot-db:
  rembg-model:
