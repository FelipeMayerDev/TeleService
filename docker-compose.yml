services:
  discordbot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: discordbot/Dockerfile
      target: discordbot
    env_file: .env
    network_mode: host
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./database.sqlite:/app/telegrambot/database.sqlite

  telegrambot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: telegrambot/Dockerfile
      target: telegrambot
    env_file: .env
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./database.sqlite:/app/telegrambot/database.sqlite
      - ./telegrambot/handlers/sticker.py:/app/telegrambot/handlers/sticker.py:ro
      - ./telegrambot/main.py:/app/telegrambot/main.py:ro
      - ./instagram-cookies.txt:/app/instagram-cookies.txt
      - rembg-model:/root/.u2net

  steam:
    restart: unless-stopped
    build:
      context: .
      dockerfile: steam/Dockerfile
      target: steam
    env_file: .env
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./database.sqlite:/app/telegrambot/database.sqlite
      - ./steam/steam-cookie.txt:/app/steam/steam-cookie.txt:ro

volumes:
  telegrambot-db:
  rembg-model:
